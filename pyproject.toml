[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-study"
version = "0.1.0"
description = "PDF를 챕터별 요약 + 4유형 검증 문제로 변환하는 MCP 서버"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "rich>=13.0.0",
    # 요약 마크다운 → HTML 변환(렌더러). rich가 이미 끌어오는 전이 의존성이라
    # 실제 설치되는 패키지는 늘지 않으나, 직접 import하므로 정직하게 명시한다.
    "markdown-it-py>=2.2.0",
    "paddlepaddle",
    "paddleocr>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pdf-study = "pdf_study.__main__:main"

# repo 루트(pdf_study/) 자체가 패키지 디렉토리인 flat 레이아웃이라 package-dir로
# "pdf_study" 패키지를 현재 디렉토리에 매핑한다.
[tool.setuptools]
packages = [
    "pdf_study",
    "pdf_study.pdf",
    "pdf_study.renderer",
    "pdf_study.tests",
    "pdf_study.tests.fixtures",
]
package-dir = { "pdf_study" = "." }
include-package-data = true

# 학습 자료 템플릿(css/js/serve.py)은 정적 리소스 — 패키지 데이터로 함께 배포.
# 합성 fixture PDF/이미지는 sdist/wheel에서 제외 (build_fixtures로 재생성).
[tool.setuptools.package-data]
"pdf_study" = ["templates/html/*", "templates/md_tui/*"]

[tool.setuptools.exclude-package-data]
"pdf_study.tests.fixtures" = ["*.pdf", "_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
